<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokédex</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div id="overlay" onclick="cerrarTodo()"></div>

<nav class="navbar">
  <a href="index.html" class="navbar-logo">Poké<span>DEX</span></a>

  <div class="navbar-enlaces">
    <a href="index.html" class="navbar-enlace activo">Pokédex</a>
    <a href="acerca.html" class="navbar-enlace">Acerca de</a>
    <a href="como-usar.html" class="navbar-enlace">Cómo usar</a>
  </div>

  <div class="navbar-auth">
    <span id="userInfo" style="display:none;"></span>
    <button id="btnPanel" style="display:none;" onclick="abrirPanel()">☰ Mi colección</button>
    <button id="btnAuth" onclick="abrirModalAuth()">Iniciar sesión</button>
  </div>

  <!-- Hamburger para mobile -->
  <button class="navbar-hamburger" id="btnHamburger" onclick="toggleDrawer()" aria-label="Menú">☰</button>
</nav>

<!-- Drawer de navegación móvil -->
<div class="navbar-drawer" id="navDrawer">
  <a href="index.html" class="navbar-enlace activo" onclick="cerrarDrawer()">Pokédex</a>
  <a href="acerca.html" class="navbar-enlace" onclick="cerrarDrawer()">Acerca de</a>
  <a href="como-usar.html" class="navbar-enlace" onclick="cerrarDrawer()">Cómo usar</a>
  <hr style="border:none;border-top:1px solid rgba(255,255,255,0.08);margin:4px 0;">
  <div id="drawerAuth" style="display:flex;flex-direction:column;gap:8px;padding-top:4px;"></div>
</div>

<!-- Panel lateral -->
<div id="panelLateral">
  <div class="panel-header">
    <span class="panel-titulo">Mi Colección</span>
    <button class="panel-cerrar" onclick="cerrarPanel()">✕</button>
  </div>
  <div class="panel-tabs">
    <button class="tab-panel activo" data-tab="favoritos" onclick="cambiarTabPanel('favoritos')">♥ Favoritos</button>
    <button class="tab-panel" data-tab="historial" onclick="cambiarTabPanel('historial')">🕐 Recientes</button>
    <button class="tab-panel" data-tab="equipos" onclick="cambiarTabPanel('equipos')">⚔ Equipos</button>
  </div>
  <div id="contenidoPanel"></div>
</div>

<!-- Modal auth -->
<div id="modalAuth">
  <div class="modal-caja">
    <button class="modal-cerrar" onclick="cerrarModalAuth()">✕</button>
    <div class="modal-logo">Poké<span>DEX</span></div>
    <div class="tabs-auth">
      <button class="tab-auth activo" data-tab="login" onclick="mostrarTabAuth('login')">Iniciar sesión</button>
      <button class="tab-auth" data-tab="register" onclick="mostrarTabAuth('register')">Registrarse</button>
    </div>
    <p id="errorAuth" class="auth-error"></p>
    <div id="formLogin">
      <div class="campo-auth">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="trainer@poke.com" autocomplete="email"/>
      </div>
      <div class="campo-auth">
        <label>Contraseña</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') handleLogin()"/>
      </div>
      <button class="btn-auth-submit" onclick="handleLogin()">Entrar</button>
    </div>
    <div id="formRegister" style="display:none;">
      <div class="campo-auth">
        <label>Nombre</label>
        <input type="text" id="regNombre" placeholder="Ash Ketchum" autocomplete="name"/>
      </div>
      <div class="campo-auth">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="ash@poke.com" autocomplete="email"/>
      </div>
      <div class="campo-auth">
        <label>Contraseña</label>
        <input type="password" id="regPass" placeholder="••••••••" autocomplete="new-password"
               onkeydown="if(event.key==='Enter') handleRegister()"/>
      </div>
      <button class="btn-auth-submit" onclick="handleRegister()">Crear cuenta</button>
    </div>
  </div>
</div>

<!-- Contenido principal -->
<div class="contenedor">
  <header>
    <div class="logo">Poké<span>DEX</span></div>
    <p>Busca cualquier Pokémon por su nombre o número</p>
  </header>

  <div class="contenedor-busqueda">
    <input type="text" id="entradaBusqueda" placeholder="Ej: pikachu, charizard, 25..." autocomplete="off"/>
    <button id="botonBuscar">Buscar</button>
  </div>

  <div id="mensaje"></div>

  <div class="cargador" id="cargador">
    <div class="pelota-cargador"></div>
    <div class="pelota-cargador"></div>
    <div class="pelota-cargador"></div>
  </div>

  <div id="tarjeta">
    <div class="tarjeta">
      <div class="tarjeta-superior" id="tarjetaSuperior">
        <div class="numero-pokemon" id="numeroPokemon">#000</div>
        <div class="contenedor-imagen">
          <img id="imagenPokemon" src="" alt=""/>
        </div>
        <div id="nombrePokemon"></div>
        <div class="tipos" id="tiposPokemon"></div>
      </div>

      <div class="tarjeta-inferior">
        <div>
          <div class="titulo-seccion">Info</div>
          <div class="cuadricula-info">
            <div class="elemento-info">
              <div class="etiqueta-info">Altura</div>
              <div class="valor-info" id="altura">—</div>
            </div>
            <div class="elemento-info">
              <div class="etiqueta-info">Peso</div>
              <div class="valor-info" id="peso">—</div>
            </div>
            <div class="elemento-info habilidades-completo">
              <div class="etiqueta-info">Habilidades</div>
              <div class="lista-habilidades" id="listaHabilidades"></div>
            </div>
          </div>
        </div>
        <div>
          <div class="titulo-seccion">Stats base</div>
          <div class="lista-estadisticas" id="listaEstadisticas"></div>
        </div>
      </div>

      <div id="botonesAccion" class="botones-accion"></div>
    </div>
  </div>

  <div class="sugerencias" id="sugerencias">
    <p>Prueba con alguno de estos:</p>
    <div class="contenedor-sugerencias">
      <button class="boton-sugerencia" data-nombre="pikachu">pikachu</button>
      <button class="boton-sugerencia" data-nombre="charizard">charizard</button>
      <button class="boton-sugerencia" data-nombre="mewtwo">mewtwo</button>
      <button class="boton-sugerencia" data-nombre="gengar">gengar</button>
      <button class="boton-sugerencia" data-nombre="eevee">eevee</button>
      <button class="boton-sugerencia" data-nombre="snorlax">snorlax</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  function toggleDrawer() {
    document.getElementById('navDrawer').classList.toggle('abierto');
  }
  function cerrarDrawer() {
    document.getElementById('navDrawer').classList.remove('abierto');
  }
  // Override cerrarTodo so overlay closes drawer OR panel
  function cerrarTodo() {
    cerrarDrawer();
    cerrarPanel();
  }
</script>
</body>
</html>
